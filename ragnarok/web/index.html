<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragnarok</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --fg:#e8e6e1; --mut:#9aa0aa; --acc:#c9a24b; --bad:#d9665b; --ok:#6fbf73; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid #2a2e36; }
  h1 { margin:0; font-size:20px; letter-spacing:.12em; color:var(--acc); }
  main { max-width:960px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border-radius:10px; padding:16px; }
  h2 { margin:0 0 10px; font-size:15px; color:var(--acc); }
  textarea { width:100%; min-height:170px; background:#101216; color:var(--fg); border:1px solid #2f343d; border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  select, input[type=text], input[type=file] { background:#101216; color:var(--fg); border:1px solid #2f343d; border-radius:6px; padding:6px 8px; font:inherit; }
  button { background:var(--acc); color:#1a1405; border:0; border-radius:6px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:#2b303a; color:var(--fg); font-weight:400; padding:5px 10px; }
  button:disabled { opacity:.5; cursor:default; }
  .mut { color:var(--mut); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:6px 8px; text-align:left; border-bottom:1px solid #2a2e36; vertical-align:middle; font-size:14px; }
  progress { width:130px; height:10px; }
  .st-done { color:var(--ok); } .st-error, .st-interrupted, .st-cancelled { color:var(--bad); }
  audio { height:30px; max-width:260px; }
  #msg { min-height:20px; margin-top:8px; }
</style>
</head>
<body>
<header><h1>RAGNAROK</h1><span class="mut" id="status">carregando…</span></header>
<main>
  <section>
    <h2>Ler um texto</h2>
    <textarea id="text" placeholder="Cole aqui o texto. Cabeçalhos Markdown (# Capítulo) viram capítulos."></textarea>
    <div class="row">
      <label>Voz <select id="voice"></select></label>
      <label>Velocidade <input type="range" id="speed" min="0.7" max="1.3" step="0.05" value="1"> <span id="speedv">1.00×</span></label>
      <label>Formato <select id="fmt"><option>mp3</option><option>wav</option><option>m4b</option><option>ogg</option></select></label>
      <button id="go">Gerar</button>
    </div>
    <div class="row">
      <label>Ou envie um arquivo .md / .txt: <input type="file" id="file" accept=".md,.txt,.markdown"></label>
      <button class="sec" id="goFile">Gerar livro do arquivo (m4b)</button>
    </div>
    <div id="msg" class="mut"></div>
  </section>
  <section>
    <h2>Fila e histórico</h2>
    <table><thead><tr><th>Título</th><th>Voz</th><th>Estado</th><th>Áudio</th><th></th></tr></thead><tbody id="jobs"></tbody></table>
    <p class="mut">Todo o processamento é local, só CPU. Nenhum texto sai deste computador.</p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmtT = s => { s = Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let voices = [];
async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) { let t = r.statusText; try { t = (await r.json()).detail || t; } catch(e){} throw new Error(t); }
  return r.json();
}
function msg(t, bad) { $("msg").textContent = t; $("msg").style.color = bad ? "var(--bad)" : ""; }
async function init() {
  const v = await api("/api/voices"); voices = v.voices;
  $("voice").innerHTML = voices.map(x => `<option value="${x.id}" ${x.id===v.default?"selected":""}>${esc(x.label)}</option>`).join("");
  $("speed").oninput = () => $("speedv").textContent = Number($("speed").value).toFixed(2) + "×";
  $("go").onclick = submitText; $("goFile").onclick = submitFile;
  refresh(); setInterval(refresh, 1500);
}
async function submitText() {
  const text = $("text").value;
  if (!text.trim()) return msg("Escreva ou cole um texto.", true);
  try {
    const j = await api("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, voice:$("voice").value, speed:Number($("speed").value), format:$("fmt").value})});
    msg("Na fila: " + j.title); refresh();
  } catch(e) { msg(e.message, true); }
}
async function submitFile() {
  const f = $("file").files[0]; if (!f) return msg("Escolha um arquivo.", true);
  const fd = new FormData(); fd.append("file", f); fd.append("voice", $("voice").value);
  fd.append("speed", $("speed").value); fd.append("format", "m4b");
  try { const j = await api("/api/jobs/upload", {method:"POST", body:fd}); msg("Livro na fila: " + j.title); refresh(); }
  catch(e) { msg(e.message, true); }
}
const label = id => (voices.find(v => v.id===id)||{label:id}).label;
function row(j) {
  let st = j.status, extra = "";
  if (st === "running") extra = `<progress max="${j.total||1}" value="${j.done}"></progress> ${j.done}/${j.total} · ~${fmtT(j.eta)}`;
  else if (st === "queued") extra = "na fila";
  else if (st === "done") extra = `<span class="st-done">pronto</span> <span class="mut">${fmtT(j.audio_seconds)} · RTF ${j.rtf.toFixed(2)} · RAM pico ${Math.round(j.peak_ram_mb)} MB${j.chapters>1?" · "+j.chapters+" cap.":""}</span>`;
  else extra = `<span class="st-${st}">${st}</span> <span class="mut">${esc(j.error||"")}</span>`;
  let au = "";
  if (j.has_audio) au = (j.format==="m4b" ? "" : `<audio controls preload="none" src="/api/jobs/${j.id}/audio"></audio> `) + `<a href="/api/jobs/${j.id}/audio?download=1"><button class="sec">Baixar .${j.format}</button></a>`;
  let acts = "";
  if (["error","interrupted","cancelled"].includes(st)) acts += `<button class="sec" onclick="act('${j.id}','retry')">Retomar</button> `;
  acts += `<button class="sec" onclick="act('${j.id}','del')">${["queued","running"].includes(st)?"Cancelar":"Apagar"}</button>`;
  return `<tr><td>${esc(j.title)}<div class="mut">${j.kind==="book"?"livro":"texto"} · ${j.chars} car.</div></td><td>${esc(label(j.voice))}</td><td>${extra}</td><td>${au}</td><td>${acts}</td></tr>`;
}
async function act(id, what) {
  try { await api(`/api/jobs/${id}` + (what==="retry" ? "/retry" : ""), {method: what==="retry" ? "POST" : "DELETE"}); } catch(e) { msg(e.message, true); }
  refresh();
}
let last = "";
async function refresh() {
  try {
    const [js, s] = await Promise.all([api("/api/jobs"), api("/api/status")]);
    $("status").textContent = `RAM pico ${Math.round(s.ram_peak_mb)} MB · agora ${Math.round(s.ram_now_mb)} MB · engine: ${s.loaded_engine||"nenhum"} · v${s.version}`;
    const html = js.map(row).join("") || `<tr><td colspan="5" class="mut">Nenhuma geração ainda.</td></tr>`;
    const playing = [...document.querySelectorAll("audio")].some(a => !a.paused);
    const sig = js.map(j => j.id+j.status+j.done).join();
    if (!playing || sig !== last) { if (!playing) $("jobs").innerHTML = html; }
    last = sig;
  } catch(e) { $("status").textContent = "sem conexão com o servidor"; }
}
init();
</script>
</body>
</html>
